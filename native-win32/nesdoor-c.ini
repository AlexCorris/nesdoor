; NESDoor-C Win7/32 runtime tuning
; Defaults below reproduce the tested v0.10 behavior.
; Invalid/out-of-range/missing values fall back to these defaults.
;
; Changes take effect the next time NESDoor-C.exe is launched.

[input]
; Direction persistence in native NES frames.
; Known-good v0.10 default: 20
dpad_hold_frames=20

; A/B persistence. Higher values can help variable-height jumps.
; Known-good v0.10 default: 20
button_hold_frames=20

; START persistence.
start_hold_frames=6

; SELECT persistence.
select_hold_frames=6

[video]
; SIXEL frames transmitted per second.
; NES emulation itself remains at the core's native rate (~60 Hz).
; Known-good v0.10 default: 20
render_fps=20
